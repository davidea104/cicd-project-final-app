name: CI

on:
  push:
    branches: [develop, main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:  # Nombre usado por la protección de ramas
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/kuadra
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2. Build
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies (con hashes)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      # 3. Pruebas estáticas
      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact --verbose

      - name: Dependency audit (pip-audit)
        run: pip-audit --strict -r requirements.txt

      # 4. Pruebas unitarias, de integración y cobertura
      - name: Unit + integration tests with coverage
        run: pytest

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          # El plan gratuito solo permite consultar el Quality Gate de main
          args: ${{ github.ref == 'refs/heads/main' && '-Dsonar.qualitygate.wait=true' || '' }}

      # 5. Release: imagen Docker
      - name: Build Docker image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Image vulnerability scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed "$IMAGE_NAME:${{ github.sha }}"

      - name: Container smoke check
        run: |
          docker run -d --name kuadra -p 8000:8000 -e AMBIENTE=ci -e SECRET_KEY=ci -e MODO_DEMO=true "$IMAGE_NAME:${{ github.sha }}"
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health > /dev/null; do sleep 1; done'
          curl -sf http://localhost:8000/bienvenida | grep -q "Kuadra"

      - name: Container logs on failure
        if: failure()
        run: docker logs kuadra || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: coverage.xml

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        id: publish
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          echo "image_uri=$IMAGE_NAME:${{ github.sha }}" >> "$GITHUB_OUTPUT"
